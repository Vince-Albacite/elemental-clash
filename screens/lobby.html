<section id="lobby" class="screen">
<h2>Lobby</h2>
<ul id="lobby_seats"></ul>
<div id="invite_box" hidden>
<button id="btn_invite">New Invite Code</button>
<textarea id="invite_offer" readonly placeholder="Send this code to the next joiner. A fresh code appears after each player connects."></textarea>
<textarea id="invite_answer" placeholder="Paste the joiner answer code"></textarea>
<button id="btn_connect">Connect</button></div>
<p id="lobby_status"></p>
<button id="btn_ready">Ready</button>
<button id="btn_start" hidden>Start</button>
<button id="btn_leave">Back</button>
</section>
