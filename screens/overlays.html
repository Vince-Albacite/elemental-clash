<button id="btn_audio" class="small" aria-label="Audio settings">
<svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 9v6h4l5 4V5L7 9z" fill="#e8e8f2"/><path d="M15 8q3 4 0 8M18 5q6 7 0 14" stroke="#e8e8f2" fill="none" stroke-width="2"/></svg></button>
<div id="audio_panel" hidden>
<label>Master <input type="range" id="vol_master" min="0" max="1" step="0.05" value="0.8"></label>
<label>Music <input type="range" id="vol_music" min="0" max="1" step="0.05" value="0.5"></label>
<label>SFX <input type="range" id="vol_sfx" min="0" max="1" step="0.05" value="0.8"></label>
</div>
<div id="countdown" hidden><span id="countdown_text"></span></div>
<div id="notice" hidden role="status"></div>
<div id="confirm_box" class="modal" hidden><div id="confirm_card" class="modal_card"><p id="confirm_text"></p><div class="row"><button id="confirm_yes">Yes</button><button id="confirm_no">No</button></div></div></div>
<div id="env" aria-hidden="true"><i class="env_layer e0"></i><i class="env_layer e1"></i><i class="env_layer e2"></i><i class="env_layer e3"></i></div>
