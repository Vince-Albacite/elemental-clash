<main id="menu" class="screen on">
<h1>Elemental Clash</h1>
<div id="icon_preview" class="face_wrap big_face"></div>
<div class="icon_rows">
<div class="row"><button class="small icon_btn" data-part="colorIndex" data-dir="-1">&lt;</button><span>Color</span><button class="small icon_btn" data-part="colorIndex" data-dir="1">&gt;</button></div>
<div class="row"><button class="small icon_btn" data-part="eyesIndex" data-dir="-1">&lt;</button><span>Eyes</span><button class="small icon_btn" data-part="eyesIndex" data-dir="1">&gt;</button></div>
<div class="row"><button class="small icon_btn" data-part="mouthIndex" data-dir="-1">&lt;</button><span>Mouth</span><button class="small icon_btn" data-part="mouthIndex" data-dir="1">&gt;</button></div></div>
<input id="player_name" maxlength="12" value="Player" aria-label="Name">
<label>Match length
<select id="duration"><option value="30">30 seconds</option><option value="60" selected>1 minute</option><option value="180">3 minutes</option><option value="300">5 minutes</option></select></label>
<button id="btn_single">Play vs Computer</button>
<button id="btn_multi">Local Multiplayer</button>
<button id="btn_guide">How to Play</button>
</main>
